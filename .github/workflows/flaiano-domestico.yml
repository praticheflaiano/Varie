name: Flaiano domestico PWA
on:
  push:
    branches: ["codex/colf-badanti-pwa-2026"]
    paths: ["colf-badanti-pwa/**", ".github/workflows/flaiano-domestico.yml"]
  pull_request:
    paths: ["colf-badanti-pwa/**", ".github/workflows/flaiano-domestico.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: colf-badanti-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verifica motore ed esportazioni
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parser indipendenti per documenti
        run: |
          python -m pip install python-docx==1.2.0 openpyxl==3.1.5 pypdf==6.1.1
          python tests/validate_exports.py
      - name: Dipendenze delle verifiche browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verifica desktop, mobile e offline
        run: npm run test:browser
      - name: Prepara pacchetto PWA
        run: |
          mkdir -p .pwa-test-artifacts
          zip -r .pwa-test-artifacts/flaiano-colf-badanti-pwa.zip index.html styles.css app.js data.js engine.js exports.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png README.md scripts package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flaiano-domestico-verifiche-e-pwa
          path: |
            colf-badanti-pwa/.pwa-test-artifacts/
            colf-badanti-pwa/playwright-report/
          retention-days: 30
